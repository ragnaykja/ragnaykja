name: tracks in the snow

on:
  schedule:
    - cron: "17 4 * * *"   # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render heatmap
        run: python3 tools/build_heatmap.py ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git diff --quiet assets/heatmap.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap.svg
          git commit -m "Update heatmap"
          git push
