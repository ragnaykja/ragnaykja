name: refresh profile

on:
  schedule:
    - cron: "17 4 * * *"   # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild assets (hero stats, trail map, heatmap)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build_assets.py ${{ github.repository_owner }}
          python3 tools/build_heatmap.py ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git diff --quiet assets/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Refresh profile assets"
          git push
