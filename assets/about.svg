<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 408" width="1200" height="408" role="img" aria-label="About Ragna"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7dfcc6"/><stop offset=".35" stop-color="#2dd4bf"/>
<stop offset=".7" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1128"/><stop offset="1" stop-color="#050816"/></linearGradient>
<radialGradient id="g1" cx=".9" cy="0" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".05" cy="1" r=".6"><stop offset="0" stop-color="#7dfcc6" stop-opacity=".14"/><stop offset="1" stop-color="#7dfcc6" stop-opacity="0"/></radialGradient></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace}
.s{fill:#e8f0ff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.95}50%{opacity:.25}}
.a1{animation:d1 16s ease-in-out infinite}.a2{animation:d2 20s ease-in-out infinite}.a3{animation:d1 24s ease-in-out infinite reverse}
@keyframes d1{0%,100%{transform:translateX(0) skewX(0)}50%{transform:translateX(-80px) skewX(-8deg)}}
@keyframes d2{0%,100%{transform:translateX(0)}50%{transform:translateX(90px)}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ln{animation:in .5s ease-out backwards}@media (prefers-reduced-motion:reduce){.ln{animation:none}}@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}</style><rect x="1" y="1" width="1198" height="406" rx="20" fill="url(#card)"/>
<rect x="1" y="1" width="1198" height="406" rx="20" fill="url(#g1)"/>
<rect x="1" y="1" width="1198" height="406" rx="20" fill="url(#g2)"/>
<rect x="1" y="1" width="1198" height="406" rx="20" fill="none" stroke="url(#ag)" stroke-opacity=".5" stroke-width="1.5"/>
<line x1="1" y1="48" x2="1199" y2="48" stroke="#ffffff" stroke-opacity=".07"/>
<circle cx="30" cy="25" r="7" fill="#ff5f57"/><circle cx="54" cy="25" r="7" fill="#febc2e"/><circle cx="78" cy="25" r="7" fill="#28c840"/>
<text x="600.0" y="31" text-anchor="middle" font-size="15" class="mono" fill="#6b7a9c">ragna@den — zsh</text>
<g class="ln" style="animation-delay:0.25s"><text x="44" y="92" font-size="19" class="mono"><tspan fill="#7dfcc6">ragna</tspan><tspan fill="#6b7a9c">@</tspan><tspan fill="#22d3ee">den</tspan><tspan fill="#6b7a9c">:~$ </tspan><tspan fill="#eef2ff">whoami</tspan></text></g><g class="ln" style="animation-delay:0.60s"><text x="44" y="126" font-size="19" class="mono"><tspan fill="#6b7a9c">› </tspan><tspan fill="#eef2ff">Ragna</tspan><tspan fill="#a5b4d4"> — developer from Germany, lone wolf in the terminal, pack animal in open source</tspan></text></g><g class="ln" style="animation-delay:0.95s"><text x="44" y="160" font-size="19" class="mono"><tspan fill="#7dfcc6">ragna</tspan><tspan fill="#6b7a9c">@</tspan><tspan fill="#22d3ee">den</tspan><tspan fill="#6b7a9c">:~$ </tspan><tspan fill="#eef2ff">cat focus.txt</tspan></text></g><g class="ln" style="animation-delay:1.30s"><text x="44" y="194" font-size="19" class="mono"><tspan fill="#6b7a9c">› </tspan><tspan fill="#7dfcc6">automation</tspan><tspan fill="#6b7a9c">  ·  </tspan><tspan fill="#22d3ee">spatial data &amp; GIS</tspan><tspan fill="#6b7a9c">  ·  </tspan><tspan fill="#8b5cf6">self-hosting</tspan><tspan fill="#6b7a9c">  ·  </tspan><tspan fill="#ec4899">tabletop tooling</tspan></text></g><g class="ln" style="animation-delay:1.65s"><text x="44" y="228" font-size="19" class="mono"><tspan fill="#7dfcc6">ragna</tspan><tspan fill="#6b7a9c">@</tspan><tspan fill="#22d3ee">den</tspan><tspan fill="#6b7a9c">:~$ </tspan><tspan fill="#eef2ff">cat stack.txt</tspan></text></g><g class="ln" style="animation-delay:2.00s"><text x="44" y="262" font-size="19" class="mono"><tspan fill="#6b7a9c">› </tspan><tspan fill="#eef2ff">TypeScript · React · Node.js · PostgreSQL/PostGIS · QGIS · Docker · Linux</tspan></text></g><g class="ln" style="animation-delay:2.35s"><text x="44" y="296" font-size="19" class="mono"><tspan fill="#7dfcc6">ragna</tspan><tspan fill="#6b7a9c">@</tspan><tspan fill="#22d3ee">den</tspan><tspan fill="#6b7a9c">:~$ </tspan><tspan fill="#eef2ff">echo $MOTTO</tspan></text></g><g class="ln" style="animation-delay:2.70s"><text x="44" y="330" font-size="19" class="mono"><tspan fill="#6b7a9c">› </tspan><tspan fill="#a5b4d4">"If I have to do it twice, I'm going to automate it."</tspan></text></g><text x="44" y="364" font-size="19" class="mono"><tspan fill="#7dfcc6">ragna</tspan><tspan fill="#6b7a9c">@</tspan><tspan fill="#22d3ee">den</tspan><tspan fill="#6b7a9c">:~$ </tspan><tspan class="cur" fill="#7dfcc6">▋</tspan></text></svg>